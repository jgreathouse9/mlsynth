name: Weekly mutation run

# Runs the semantic mutant catalogue in tools/mutation/targets.toml on a
# schedule, out-of-band from the PR gate (build.yml). Deliberately not a merge
# gate: a mutation score is a diagnostic to read, not a threshold to defend,
# and the run is too slow to sit in front of a merge.
#
# One job per target, so a slow or failing target does not hide the others and
# the summary names which one needs attention.
on:
  schedule:
    - cron: "0 3 * * 1"     # 03:00 UTC Mondays
  workflow_dispatch:
    inputs:
      target:
        description: "Run a single target (blank runs all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONWARNINGS: "ignore"
  MPLBACKEND: "Agg"
  # The harness sets this per subprocess as well; setting it here makes the
  # intent visible in the log. Derandomization is mandatory for any run feeding
  # a mutation score -- a flakily-killed mutant corrupts it.
  MLSYNTH_HYPOTHESIS_PROFILE: "ci"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: list
        name: Read the target names out of targets.toml
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, tomllib, pathlib
          data = tomllib.loads(pathlib.Path("tools/mutation/targets.toml").read_text())
          names = [t["name"] for t in data["target"]]
          chosen = os.environ.get("ONLY", "").strip()
          if chosen:
              names = [n for n in names if n == chosen]
          print("targets=" + json.dumps(names))
          PY
        env:
          ONLY: ${{ github.event.inputs.target }}

  mutate:
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist hypothesis
      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV
      - name: Run the catalogue for ${{ matrix.target }}
        run: python tools/mutation/run_mutants.py --target "${{ matrix.target }}"
