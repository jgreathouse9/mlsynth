name: Test MLSYNTH

# The full test suite runs ONCE per change -- on the pull request only (the gate).
# It does NOT run on push: [main], so a merge never re-tests the identical tree.
# The coverage badge is updated out-of-band by the daily `coverage-badge.yml`
# workflow, so this gate never commits to / de-heads a PR.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_target:
        description: "Enter 'all', 'smoke', or a test file (e.g. test_lexscm.py)"
        required: false
        default: "all"

permissions:
  contents: read
  pull-requests: read     # dorny/paths-filter reads the PR's changed files

# Cancel superseded runs on the same ref instead of piling up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONWARNINGS: "ignore"
  MPLBACKEND: "Agg"          # headless matplotlib, belt-and-suspenders

jobs:
  build:
    runs-on: ubuntu-latest
    # The cap exists to kill a genuinely hung suite, not to bound a healthy one.
    # It was raised 40 -> 55 once and was reached again: the suite grows, a slow
    # runner lands within a few minutes of the cap, and a healthy run is killed
    # at 99%, which GitHub reports as 'cancelled' -- neither a pass nor a
    # failure, and a full re-run to tell them apart.
    #
    # Sharding reduced the work per job but not evenly. The split is round-robin
    # over sorted module names, which is blind to how long a module takes, and
    # shard 0 measures about twice shard 1 on every interpreter (#479): on
    # 2026-08-16 across one matrix, shard 0 ran 22:22 / >30 / >30 against shard
    # 1's 7:06 / 15:11 / 17:16. 30 was set on the reasoning that a quarter of
    # the modules is a quarter of the work, and it is not; it killed a green
    # shard on three PRs, once after the suite had already printed
    # '2561 passed'.
    #
    # The cap has to clear the SLOWEST shard on the slowest interpreter, not the
    # average, so 50 leaves headroom over today's 30 while still bounding a
    # hang. Balancing the shards by duration is the actual fix and is tracked
    # separately; this stops healthy runs being reported as cancelled meanwhile.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Decide whether this change can affect the test suite. Docs-only PRs skip
      # the (slow) run -- the job still completes, so a required "build" check
      # stays satisfiable. Workflow_dispatch always runs.
      #
      # This list must cover every directory the suite READS, not only the one it
      # lives in, because a skipped check reports success and a skipped success
      # is indistinguishable from a real one. 'benchmarks/**' and 'basedata/**'
      # are here for that reason: tests/test_benchmark_reference.py reads
      # benchmarks/registry.py and benchmarks/cases/, and 75 test files load
      # fixtures from basedata/. Benchmarks-only PRs used to skip the run
      # legitimately; they stopped being safe to skip when the registry-coverage
      # test was added. mlsynth/tests/test_benchmark_reference.py asserts this
      # list against those dependencies, so narrowing it fails a test rather
      # than silently disarming CI.
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'mlsynth/**'
              - 'benchmarks/**'
              - 'basedata/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - '.github/workflows/build.yml'
              - '.github/workflows/benchmarks.yml'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip          # cache pip downloads -> faster installs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The [bayes] optional extra (NumPyro/JAX) so the gate actually
          # exercises the estimators that need it (BFSC, SPOTSYNTH's Bayesian
          # mode). Without it their tests skip and get no CI coverage.
          pip install numpyro
          pip install pytest pytest-cov pytest-xdist coverage hypothesis

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      # A failing test FAILS the job (no continue-on-error). Parallel via -n auto.
      # Runs on dispatch always; on a PR only when code (not just docs/benchmarks)
      # changed. Coverage is produced out-of-band by coverage-badge.yml, so the
      # gate runs pass/fail only -- no --cov overhead here.
      - name: Run tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: |
          # PRs run the full suite; dispatch honors the input target.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.test_target }}"
          else
            TARGET="all"
          fi
          echo "Test target: $TARGET"

          # --num-shards/--shard splits the suite by test module across the
          # matrix; -n auto still spreads this shard's tests over the runner's
          # cores, so a slow file does not serialise its own shard.
          SHARD="--num-shards 4 --shard ${{ matrix.shard }}"

          if [ "$TARGET" = "smoke" ]; then
            pytest -n auto $SHARD -k "smoke" --tb=short
          elif [ "$TARGET" = "all" ]; then
            pytest -n auto $SHARD --tb=short
          else
            MATCH=$(find . -name "$TARGET" | head -n 1)
            if [ -z "$MATCH" ]; then
              echo "ERROR: Could not find test file: $TARGET"; find . -name "test_*.py"; exit 1
            fi
            pytest -n auto $SHARD "$MATCH" --tb=short
          fi

      # Once, not once per shard: the dist does not depend on which tests ran,
      # and four shards uploading the same artifact name is an error.
      - name: Build distribution
        if: matrix.shard == 0
        run: |
          python -m pip install build
          python -m build

      - name: Upload artifact
        if: matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: mlsynth-dist
          path: dist/

  # Cross-version coverage: the `build` job above runs the suite on 3.11 (and
  # is the required gate); this job exercises the rest of the supported range so
  # the `requires-python` floor and the Python classifiers in pyproject.toml are
  # backed by an actual test run, not just an assertion. 3.11 is omitted here to
  # avoid duplicating `build`.
  pyversions:
    runs-on: ubuntu-latest
    # Same reasoning as `build` above. These are the jobs that reached the old
    # cap first: 3.12 and 3.13 run slower than the 3.11 `build` job on identical
    # work, so they were the ones killed at 99%.
    # Same cap and the same measurement as `build` above (#479); these are the
    # jobs that lost shards.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Kept identical to the build job's filter above, including the reasoning
      # recorded there. The test asserts every copy, so the two cannot drift.
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'mlsynth/**'
              - 'benchmarks/**'
              - 'basedata/**'
              - 'requirements.txt'
              - 'pyproject.toml'
              - '.github/workflows/build.yml'
              - '.github/workflows/benchmarks.yml'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No pip cache here. This job's install step is conditional (skipped on
          # docs/benchmarks-only PRs), and setup-python's cache post-step errors
          # when nothing was installed -- which failed this job on every docs-only
          # PR. The build job above keeps the cache (its install is unconditional).

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The [bayes] extra so BFSC / SPOTSYNTH-Bayesian run on every
          # supported Python version, not just the 3.11 build job.
          pip install numpyro
          pip install pytest pytest-xdist hypothesis

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Run tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: |
          pytest -n auto --tb=short \
            --num-shards 4 --shard ${{ matrix.shard }}
