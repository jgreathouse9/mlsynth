test-command = "python -m pytest mlsynth/tests/test_mlsc_penalty_properties.py mlsynth/tests/test_mlsc_properties.py -q -p no:cacheprovider"
timeout = 120.0

  [[target.mutant]]
  id = "penalty-kernel-no-longer-holds-the-population-ray"
  find = "+ norm_sq * np.outer(ones, ones)"
  replace = "+ 0.5 * norm_sq * np.outer(ones, ones)"
  models = "a penalty whose kernel is no longer the population-proportional ray, so lambda stops pricing departure from the classical aggregation and starts penalising the aggregation itself"

[[target]]
name = "syndes-gram"
module-path = "mlsynth/utils/syndes_helpers/gram.py"
test-command = "python -m pytest mlsynth/tests/test_syndes_gram_properties.py mlsynth/tests/test_syndes_gram.py -q -p no:cacheprovider"
timeout = 180.0

  [[target.mutant]]
  id = "closed-form-claims-exactness-everywhere"
  find = "exact = np.all(signs * contrast >= tol, axis=1)"
  replace = "exact = np.ones(signs.shape[0], dtype=bool)"
  models = "a bound that reports itself as the optimum on every design, so wherever the dropped sign conditions actually bind the caller receives a number strictly below the true objective and believes it exact"

  [[target.mutant]]
  id = "rayleigh-caps-with-the-wrong-end-of-the-spectrum"
  find = "top = float(np.linalg.eigvalsh(self.R)[-1])"
  replace = "top = float(np.linalg.eigvalsh(self.R)[0])"
  models = "a global bound built from the smallest eigenvalue of the cut matrix instead of the largest, which inverts the inequality and yields a 'lower bound' above the optimum -- valid-looking, and wrong in the direction that matters"

  [[target.mutant]]
  id = "conditioning-guard-never-fires"
  find = "reliable = bool(np.isfinite(condition) and condition <= float(condition_max))"
  replace = "reliable = True"
  models = "an engine that inverts a Gram matrix it cannot resolve, returning a confidently wrong bound in the one regime the module promises to return none"

  [[target.mutant]]
  id = "maxcut-scores-against-a-stale-gradient"
  find = "g += 2.0 * (R[:, j] - R[:, i])"
  replace = "g += 2.0 * R[:, j]"
  models = "an incremental update that adds the entering unit without removing the leaving one, so every later sweep scores its neighbourhood against a gradient for a design that was never visited and the returned set is not a local optimum"

[[target]]
name = "syndes-certificate-validity"
module-path = "mlsynth/utils/syndes_helpers/certificate.py"
test-command = "python -m pytest mlsynth/tests/test_syndes_certificate.py mlsynth/tests/test_syndes_certificate_validity.py mlsynth/tests/test_syndes_certificate_validity_properties.py mlsynth/tests/test_syndes_bound_failure.py -q -p no:cacheprovider -x"
timeout = 600.0

  [[target.mutant]]
  id = "a-raising-search-ends-the-fit"
  find = "        except MlsynthEstimationError as exc:"
  replace = "        except ZeroDivisionError as exc:"
  models = "a search that raises takes the whole fit down with it, when the certificate is a diagnostic that can report no bound and say why"

  [[target.mutant]]
  id = "a-stopped-search-is-certified"
  find = "        closed = outcome.status == \"optimal\""
  replace = "        closed = True"
  models = "a search stopped at its node or candidate limit read as closed, so its incumbent is certified optimal on a bound that does not reach it"

  [[target.mutant]]
  id = "the-bound-is-the-searchs-incumbent"
  find = "        return outcome.dual_bound, closed, why"
  replace = "        return outcome.objective, closed, why"
  models = "the search's incumbent reported as the bound, which a stopped search's incumbent exceeds the optimum by, so the bound stops being one"

  [[target.mutant]]
  id = "an-uncertified-two-way-search-is-certified"
  find = "    closed = bool(raw.get(\"certified\"))"
  replace = "    closed = True"
  models = "a two-way search past its candidate limit, which returns the swap search's design against the Rayleigh bound, read as closed"

  [[target.mutant]]
  id = "a-passed-search-is-repeated"
  find = "    if search is None:"
  replace = "    if True:"
  models = "the certificate searching again when the design's own search ran on the same panel, penalty and restrictions: the same bound at the cost of a second search"

  [[target.mutant]]
  id = "the-restrictions-are-dropped"
  find = "            search = _search(Y, K, mode, lam_value, restrictions, costs, budget)"
  replace = "            search = _search(Y, K, mode, lam_value, None, costs, budget)"
  models = "the certificate bounding the unrestricted problem, a valid but looser bound, so a restricted design proven optimal reads as a gap"

  [[target.mutant]]
  id = "the-budget-is-dropped"
  find = "            search = _search(Y, K, mode, lam_value, restrictions, costs, budget)"
  replace = "            search = _search(Y, K, mode, lam_value, restrictions, None, None)"
  models = "the certificate bounding the problem without the cost budget, a valid but looser bound, so a budgeted design proven optimal reads as a gap"

  [[target.mutant]]
  id = "the-gap-has-a-unit-floor"
  find = "    scale = max(abs(float(incumbent)), abs(float(lb)))"
  replace = "    scale = max(abs(float(incumbent)), abs(float(lb)), 1.0)"
  models = "the pre-fix denominator, floored at one, which makes the gap depend on the outcome's units: on a panel measured in small units every design reads as optimal, whatever its distance from the bound"

  [[target.mutant]]
  id = "the-gap-is-relative-to-the-incumbent-alone"
  find = "    scale = max(abs(float(incumbent)), abs(float(lb)))"
  replace = "    scale = abs(float(incumbent))"
  models = "a gap scaled by the incumbent only, which is unbounded below when the bound exceeds a small incumbent, so a contradiction reads as a gap of any size and the gap is no longer comparable across designs"

  [[target.mutant]]
  id = "a-contradiction-is-clamped-to-a-zero-gap"
  find = "        if gap >= -_BOUND_TOLERANCE:"
  replace = "        if True:"
  models = "the pre-fix clamp at zero: a lower bound above the incumbent says the bound or the incumbent is wrong, and the clamp reported it as a design proven optimal"

  [[target.mutant]]
  id = "rounding-is-read-as-a-contradiction"
  find = "_BOUND_TOLERANCE = 1e-8"
  replace = "_BOUND_TOLERANCE = 0.0"
  models = "a bound that sits on the incumbent to the relaxation's rounding is reported as a contradiction, so a design the bound proves optimal warns and loses its certificate"

  [[target.mutant]]
  id = "a-contradiction-keeps-its-certificate"
  find = "            certified = False"
  replace = "            certified = certified"
  models = "a negative gap that warns but leaves certified=True, so a caller filtering on the flag keeps a certificate the note says certifies nothing"

  [[target.mutant]]
  id = "the-per-unit-penalty-is-not-averaged"
  find = "    return float((resid ** 2).sum() / (len(S) * T) + lam / len(S) * (Q ** 2).sum())"
  replace = "    return float((resid ** 2).sum() / (len(S) * T) + lam * (Q ** 2).sum())"
  models = "a per-unit incumbent scored with the penalty summed over treated units instead of averaged, so the incumbent and the bound are two different objectives and the gap mixes them"

  [[target.mutant]]
  id = "the-pooled-incumbent-drops-the-penalty"
  find = "    return float(r @ r / T + lam * (a @ a + b @ b))"
  replace = "    return float(r @ r / T)"
  models = "a two-way or one-way incumbent scored without the ridge term the bound includes, which places the incumbent below the bound and turns every certificate into a contradiction"

[[target]]
name = "syndes-certificate-wiring"
module-path = "mlsynth/estimators/syndes.py"
test-command = "python -m pytest mlsynth/tests/test_syndes_certificate_validity.py mlsynth/tests/test_syndes_certificate.py -q -p no:cacheprovider -x -k \"holdout or estimator\""
timeout = 300.0

  [[target.mutant]]
  id = "the-certificate-searches-again-in-sample"
  find = "                budget=self.budget, search=in_sample if use_exact else None,"
  replace = "                budget=self.budget, search=None,"
  models = "the estimator discarding the search it ran on the whole pre-period, so the certificate searches the same problem a second time"

  [[target.mutant]]
  id = "holdout-reuses-the-slice-search"
  find = "            design = ranked[0]\n            pool = _syndes_pool_menu(ranked, inputs, self.costs, self.alpha,\n                                     oos_errors=oos_errors)"
  replace = "            design = in_sample = ranked[0]\n            pool = _syndes_pool_menu(ranked, inputs, self.costs, self.alpha,\n                                     oos_errors=oos_errors)"
  models = "under holdout the leading slice's search handed to the certificate, whose bound refers to another panel than the incumbent, so the gap compares two problems"

  [[target.mutant]]
  id = "restrictions-do-not-reach-the-certificate"
  find = "                lam=lam_design, restrictions=restrictions, costs=self.costs,"
  replace = "                lam=lam_design, restrictions=None, costs=self.costs,"
  models = "the estimator certifying a restricted design against the unrestricted problem, so a restricted optimum reads as a gap"

  [[target.mutant]]
  id = "the-incumbent-is-the-fitting-objective"
  find = "                design_objective(inputs.Y_pre, mode_internal, design, lam_design),"
  replace = "                float(design.objective_value),"
  models = "the pre-fix incumbent: under holdout selection the design's objective is measured on the leading slice of the pre-period, and the bound on the whole of it, so the gap compared two panels"

  [[target.mutant]]
  id = "the-bound-re-estimates-the-penalty"
  find = "                lam=lam_design,"
  replace = "                lam=self.lam,"
  models = "the pre-fix penalty: with lam unset the bound re-estimates it on the whole pre-period while the design used the slice's, so the bound and the incumbent are two different programs"

