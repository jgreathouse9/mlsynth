  id = "mbic-penalty-selected-then-discarded"
  find = """            beta, intercept, cf, support = fit_lasso(
                y, X, T0, alpha=lasso_alpha, intercept=use_intercept,
                standardize=standardize)"""
  replace = """            beta, intercept, cf, support = fit_lasso(
                y, X, T0, intercept=use_intercept, standardize=standardize)"""
  models = "the criterion computed and then dropped on the floor: the penalty is selected, recorded in the metadata the caller reads, and the fit cross-validates its own anyway. Everything the estimator reports about which rule it used stays true and the number it reports is from the other rule"

