  [[target.mutant]]
  id = "rmse-uses-the-sample-denominator"
  find = "np.sqrt(r @ r / r.size)"
  replace = "np.sqrt(r @ r / max(r.size - 1, 1))"
  models = "a root-mean-square error computed with the sample denominator, not the population one, which is the more defensible statistic and the wrong one for this contract"

  [[target.mutant]]
  id = "r-squared-guard-returns-to-an-exact-zero-test"
  find = "if denom <= noise_floor:"
  replace = "if denom == 0.0:"
  models = "the regression this guard was added for: a flat treated series whose centering leaves 1e-20 of residue is admitted, and R-squared is reported as 1.0 or -1e19 depending only on the residuals"

