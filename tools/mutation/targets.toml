  [[target.mutant]]
  id = "closed-form-claims-exactness-everywhere"
  find = "exact = np.all(signs * contrast >= tol, axis=1)"
  replace = "exact = np.ones(signs.shape[0], dtype=bool)"
  models = "a bound that reports itself as the optimum on every design, so wherever the dropped sign conditions actually bind the caller receives a number strictly below the true objective and believes it exact"

  [[target.mutant]]
  id = "rayleigh-caps-with-the-wrong-end-of-the-spectrum"
  find = "top = float(np.linalg.eigvalsh(self.R)[-1])"
  replace = "top = float(np.linalg.eigvalsh(self.R)[0])"
  models = "a global bound built from the smallest eigenvalue of the cut matrix instead of the largest, which inverts the inequality and yields a 'lower bound' above the optimum -- valid-looking, and wrong in the direction that matters"

  [[target.mutant]]
  id = "conditioning-guard-never-fires"
  find = "reliable = bool(np.isfinite(condition) and condition <= float(condition_max))"
  replace = "reliable = True"
  models = "an engine that inverts a Gram matrix it cannot resolve, returning a confidently wrong bound in the one regime the module promises to return none"

  [[target.mutant]]
  id = "maxcut-scores-against-a-stale-gradient"
  find = "g += 2.0 * (R[:, j] - R[:, i])"
  replace = "g += 2.0 * R[:, j]"
  models = "an incremental update that adds the entering unit without removing the leaving one, so every later sweep scores its neighbourhood against a gradient for a design that was never visited and the returned set is not a local optimum"

[[target]]
name = "syndes-partition"
module-path = "mlsynth/utils/syndes_helpers/partition.py"
test-command = "python -m pytest mlsynth/tests/test_syndes_exact_properties.py mlsynth/tests/test_syndes_partition.py -q -p no:cacheprovider"
timeout = 180.0

  [[target.mutant]]
  id = "contrast-sums-the-two-synthetic-paths"
  find = "contrast[rows, control_idx] = -b"
  replace = "contrast[rows, control_idx] = b"
  models = "a residual built from the sum of the treated and control synthetic paths instead of their difference, which optimises a program the paper never wrote while still returning feasible-looking weights"

  [[target.mutant]]
  id = "duality-gap-taken-against-the-worst-vertex"
  find = "- grad_a.min(axis=1) - grad_b.min(axis=1)"
  replace = "- grad_a.max(axis=1) - grad_b.max(axis=1)"
  models = "a Frank-Wolfe gap linearised toward the worst vertex of each simplex instead of the best, so 'value - gap' stops bounding the optimum from below and the exact backend can prune the design it was looking for"

[[target]]
name = "syndes-exact"
module-path = "mlsynth/utils/syndes_helpers/exact.py"
test-command = "python -m pytest mlsynth/tests/test_syndes_exact.py -q -p no:cacheprovider"
timeout = 300.0

  [[target.mutant]]
  id = "screen-never-escalates-to-the-inner-solver"
  find = "alive = np.flatnonzero((~scored.exact) & (scored.lower < best_value))"
  replace = "alive = np.flatnonzero(np.zeros(scored.lower.shape, dtype=bool))"
  models = "a search that trusts the closed form for every design and never solves a survivor, so on any instance where the sign conditions bind it returns whichever design happened to settle in closed form and calls it optimal"

  [[target.mutant]]
  id = "budget-is-validated-then-ignored"
  find = "if float(self.costs[list(subset)].sum()) > self.budget + 1e-9:"
  replace = "if float(self.costs[list(subset)].sum()) < 0.0:"
  models = "a cost budget checked for well-formedness at configuration time and then never enforced during the search, so the returned design can cost more than the experiment can pay"

  [[target.mutant]]
  id = "forcing-satisfied-by-any-one-named-unit"
  find = "if not self.forced_in <= chosen:"
  replace = "if self.forced_in and not (self.forced_in & chosen):"
  models = "a to_be_treated rule read as 'at least one of these' instead of 'all of these', which silently drops units the experimenter committed to treating"

[[target]]
name = "syndes-enumeration"
module-path = "mlsynth/utils/syndes_helpers/enumeration.py"
test-command = "python -m pytest mlsynth/tests/test_syndes_enumeration.py -q -p no:cacheprovider"
timeout = 180.0

  [[target.mutant]]
  id = "gate-reads-the-unrestricted-count"
  find = "size=ways[0][k_free],"
  replace = "size=comb(int(N), int(K)),"
  models = "the count this module exists to compute, reverted to the binomial the search used before -- the walk still visits only admissible designs, but the enumeration limit is measured against designs that do not exist, so a restricted instance is refused for being large in a space it never enters"

  [[target.mutant]]
  id = "quota-ignores-forced-members"
  find = "held = len(forced & member_set)"
  replace = "held = 0"
  models = "a stratum quota that does not credit the forced units already inside the group, so a ceiling of one admits a design holding a forced member plus another, and the returned design breaks the coverage rule it was given"

  [[target.mutant]]
  id = "overlapping-strata-treated-as-a-partition"
  find = "if not strata or not _disjoint(strata):"
  replace = "if not strata:"
  models = "disjointness assumed instead of checked, so a unit shared by two strata is drawn once by each -- the walk emits sets with a repeated unit and the same design more than once, and the count inherits both"

  [[target.mutant]]
  id = "forbidden-units-stay-in-the-ground-set"
  find = "if i not in forced_set and i not in forbidden_set]"
  replace = "if i not in forced_set]"
  models = "a ground set that drops the forced units but keeps the forbidden ones, so units the design is required to leave alone are offered to the walk and can be treated"

  [[target.mutant]]
  id = "stratum-floor-is-dropped"
  find = "low = max(0, (0 if lo is None else int(lo)) - held)"
  replace = "low = 0"
  models = "only the ceilings of a coverage quota enforced, so a minimum-per-stratum rule is accepted and silently does nothing, and designs that cover too few groups are admitted"

  [[target.mutant]]
  id = "fast-path-ignores-forced-units"
  find = "if not self.forced and len(self.groups) == 1:"
  replace = "if len(self.groups) == 1:"
  models = "the single-group shortcut taken when forced units exist, so the units the design must contain are never merged in and every emitted set is short by the forced count -- the specialisation for the unrestricted case silently applied to a restricted one"

  [[target.mutant]]
  id = "group-order-assumed-ascending"
  find = "_presorted=not forced_set and _ascending(groups))"
  replace = "_presorted=not forced_set)"
  models = "the sort skipped whenever no unit is forced, on the assumption that the groups run uphill -- a stratum over the high units leaves the low ones to the leftover group, which lands last, so the emitted tuple runs downhill and names a treated set whose units are read in the wrong positions"

[[target]]
name = "miqp-accel"
module-path = "mlsynth/utils/miqp_accel.py"
test-command = "python -m pytest mlsynth/tests/test_miqp_accel.py -q -p no:cacheprovider"
timeout = 300.0

  [[target.mutant]]
  id = "warm-bits-follow-the-index-set-iteration-order"
  find = "return sorted(data[s.BOOL_IDX])"
  replace = "return list(data[s.BOOL_IDX])"
  models = "the defect this helper exists to prevent: cvxpy returns the boolean columns as a set, so iterating it pairs each warm bit with whichever variable the hash table happens to yield, and SCIP is started from a design the caller never named -- correct below the size where the two orders diverge, and silently wrong above it"

  [[target.mutant]]
  id = "warm-start-reported-applied-without-being-stored"
  find = "self.warm_applied = bool(model.addSol(sol))"
  replace = "model.addSol(sol); self.warm_applied = True"
  models = "the flag set from having called addSol instead of from what it returned, so a start SCIP declined is reported to the caller as applied and a solve that was never accelerated looks as though it was"

  # Recorded, not carried: replacing the objective's support with every column
  # ("nz = np.arange(c.shape[0])") is an equivalent mutant. The extra terms all
  # carry coefficient zero, so quicksum builds the same constraint and only the
  # time spent building it changes. It survived, correctly, and is retired here
  # so nobody re-adds it expecting a kill.

  [[target.mutant]]
  id = "invalid-bound-backstop-only-catches-a-failed-solve"
  find = "if val is None or val < L - 1e-6 * max(1.0, abs(L)):"
  replace = "if val is None:"
  models = "the backstop reduced to a check that the solve produced a value. The objective is an epigraph variable, so a cut above the true optimum does not make the model infeasible -- it inflates that variable and returns a design whose real objective sits below the cut floor. Without the comparison the caller keeps that design and the too-high bound is never detected"

[[target]]
name = "pda-lasso-mbic"
module-path = "mlsynth/utils/pda_helpers/lasso/estimation.py"
test-command = "python -m pytest mlsynth/tests/test_pda_lasso_mbic.py -q -p no:cacheprovider"
timeout = 300.0

  [[target.mutant]]
  id = "criterion-scores-a-fit-the-estimator-never-uses"
  find = """    beta, _, _, _ = fit_lasso(y, X, T0, alpha=alpha, intercept=False,
                              standardize=True)"""
  replace = "    beta, _, _, _ = fit_lasso(y, X, T0, alpha=alpha)"
  models = "the criterion evaluated under mlsynth's own conventions -- intercept, unscaled donors -- while the estimate it selects a penalty for is fitted under glmnet's. The rule still returns a penalty from the grid and the argmin is still an argmin, so every structural test passes; what changes is that the penalty was chosen for a different model than the one estimated, which is the defect that produced two failures the first time this landed"

  [[target.mutant]]
  id = "glmnet-standardisation-centres-the-donors"
  find = "    model.fit(X_pre / scale, y_pre)"
  replace = "    model.fit((X_pre - X_pre.mean(axis=0)) / scale, y_pre)"
  models = "the donors centred before the penalised fit, which is what glmnet does when it fits an intercept and not what it does without one. It moves the selected coefficient on the reference panel from 0.51838043 to 0.49909512, and no invariant of the rule notices: the support is the same, the argmin is still an argmin, and the criterion is still log MSE plus the charge. Only the pinned glmnet value separates them"

  # Recorded, not carried: centring inside `_glmnet_scale`
  # ("X_pre = X_pre - X_pre.mean(axis=0)" before the np.std call) is an
  # equivalent mutant. Standard deviation is shift invariant, so the returned
  # scale agrees to 2e-16 and the fit is unchanged. It survived, correctly, and
  # is retired here so nobody re-adds it expecting a kill -- the centring that
  # does change the answer is the one above, on the matrix that gets fitted.

  [[target.mutant]]
  id = "penalty-charge-counts-periods-instead-of-donors"
  find = "    penalty = const * loglog * np.log(T0) / T0 * k"
  replace = "    penalty = const * loglog * np.log(T0) / T0"
  models = "the per-donor charge applied once instead of once per selected donor. The criterion is then log MSE plus a constant, so it is minimised at the densest fit for every value of the constant, and the constant stops being the knob the paper tunes"

  [[target.mutant]]
  id = "loglog-floor-inverted-for-small-donor-pools"
  find = "    loglog = max(np.log(np.log(n_donors)) if n_donors > 1 else 0.0, 0.0)"
  replace = "    loglog = np.log(np.log(n_donors)) if n_donors > 1 else 0.0"
  models = "the floor removed, so a pool of two donors gives log(log(2)) = -0.37 and the charge per donor turns into a reward per donor. Two donors is an ordinary pool, and the rule would select the densest fit there for the same reason it should select the sparsest"

  [[target.mutant]]
  id = "argmin-over-the-grid-becomes-argmax"
  find = "    return float(penalties[int(np.argmin(scores))])"
  replace = "    return float(penalties[int(np.argmax(scores))])"
  models = "the grid search keeping the worst penalty by its own criterion. It still returns a grid point and still moves with the constant, so only a test that recomputes the criterion independently sees it"

  [[target.mutant]]
  id = "zero-penalty-admitted-to-the-grid"
  find = "    if np.any(penalties <= 0):"
  replace = "    if np.any(penalties < 0):"
  models = "a zero penalty accepted as a path point. That is ordinary least squares on every donor, whose pre-period MSE is the smallest available, so it wins the criterion whenever a caller's grid starts at zero and the selection stops being a LASSO selection at all"

[[target]]
name = "pda-orchestration"
module-path = "mlsynth/utils/pda_helpers/orchestration.py"
test-command = "python -m pytest mlsynth/tests/test_pda_lasso_mbic.py mlsynth/tests/test_pda.py -q -p no:cacheprovider"
